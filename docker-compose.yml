services:
  # ========================================================
  # Backend API & Frontend (Node.js + Express)
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets:
        - frontend_env
    container_name: zedan-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_SSL: "true"
    volumes:
      - ./backend/uploads/inventario-ia:/app/backend/uploads/inventario-ia
    networks:
      - zedan-net

  # ========================================================
  # n8n - Motor de Automatización y Agente IA
  # ========================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: zedan-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-http://n8n:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Bogota}
      - TZ=${TZ:-America/Bogota}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/n8n-workflows:ro
    networks:
      - zedan-net

  # ========================================================
  # OpenWA - API WhatsApp & Dashboard para n8n
  # (Gateway oficial para @rmyndharis/n8n-nodes-openwa)
  # ========================================================
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: zedan-openwa
    restart: unless-stopped
    ports:
      - "${OPENWA_PORT:-2785}:2785"
    environment:
      - PORT=2785
      - NODE_ENV=development
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=true
      - AUTO_START_SESSIONS=true
      - CSP_UPGRADE_INSECURE_REQUESTS=false
      - SSRF_ALLOWED_HOSTS=n8n
    volumes:
      # Persistencia de base de datos SQLite, sesiones de WhatsApp y tokens
      - ./openwa-data:/app/data
    networks:
      - zedan-net

# ========================================================
# Volúmenes y Redes
# ========================================================
secrets:
  frontend_env:
    file: ./frontend-react/.env

volumes:
  n8n_data:

networks:
  zedan-net:
    driver: bridge
